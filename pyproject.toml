[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roborobust"
version = "0.1.0"
description = "MuJoCo differential-drive navigation: PPO domain-randomization robustness study (simulation only)"
readme = "README.md"
requires-python = ">=3.11"
# Ranges here; the exact tested set is frozen in requirements.lock.
dependencies = [
  "mujoco>=3.1,<4",
  "gymnasium>=1.0,<2",
  "stable-baselines3>=2.4,<3",
  "torch>=2.2",
  "numpy>=1.26",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "tabulate>=0.9"]  # tabulate: only for scripts/make_dev_log.py

[project.scripts]
roborobust = "roborobust.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
roborobust = ["robot.xml", "showcase.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: tests that train PPO or run many episodes (still CPU-only, seconds to a minute)"]
