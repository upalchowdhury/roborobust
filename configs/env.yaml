# Environment configuration. SI units throughout (m, kg, s, rad, N, N*m).
# `robot:` values are NOT used to build the physics (robot.xml is the single physical asset);
# env.py asserts they match the compiled model so the documentation here cannot drift from it.
env_version: roborobust-env-1.0

physics:
  timestep: 0.005          # s  (200 Hz), integrator: implicitfast (see DECISIONS.md)
  substeps: 10             # physics steps per control step -> control dt = 0.05 s (20 Hz)
max_episode_steps: 600     # control steps = 30 s simulated; EXTERNAL cutoff -> truncated, not terminated

room:
  half_size: 3.0           # m  -> 6 m x 6 m enclosure, inner wall faces at +-3.0 m

robot:
  body_radius: 0.18        # m   chassis cylinder radius
  total_mass: 5.1          # kg  chassis 4.5 + wheels 2x0.3 + casters 2x0.05
  wheel_radius: 0.05       # m
  track_width: 0.30        # m   distance between wheel centres
  wheel_damping: 0.04      # N*m*s/rad  drivetrain viscous friction per wheel
  wheel_armature: 0.001    # kg*m^2     reflected rotor/gearbox inertia per wheel
  wheel_friction: 1.0      # Coulomb sliding friction coefficient, wheel/floor
  caster_friction: 0.01    # Coulomb sliding friction coefficient, caster/floor (low-friction support)
  motor_kv: 0.4            # N*m*s/rad  velocity-actuator gain
  motor_force_limit: 0.5   # N*m        per-wheel torque limit (nominal)
  max_wheel_speed: 10.0    # rad/s -> action 1.0; ideal 0.5 m/s linear speed

sensing:
  n_rays: 24               # planar range rays over 360 deg, ray 0 = straight ahead, CCW positive
  max_range: 3.0           # m (readings divided by this)
  ray_height: 0.10         # m above floor; inside chassis height band (0.03-0.15), below wall top (0.30)
  v_bound: 0.5             # m/s   forward velocity scaling bound, then clipped to [-1, 1]
  w_bound: 3.5             # rad/s yaw-rate scaling bound, then clipped to [-1, 1]

verifier:
  goal_radius: 0.30        # m   center-to-goal distance for success
  max_success_speed: 0.10  # m/s planar speed for success
  dwell_steps: 5           # consecutive control steps both conditions must hold
  max_tilt_deg: 45.0       # tip-over failure threshold
  arena_half_extent: 3.0   # m   chassis centre beyond this -> out_of_bounds

reward:
  success_bonus: 10.0
  failure_penalty: 10.0    # magnitude; reward is -10 on collision / tip / out-of-bounds
  step_cost: 0.01
  shaping_alpha: 50.0      # Phi(s) = -goal_distance / room_diagonal. Spec starts at 1.0; raised to 50 on EMPTY-ROOM
                           # VALIDATION data after alpha=1 failed the Gate C diagnostic (2/20). See docs/dev_log.md.
  gamma: 0.999             # MUST equal ppo.gamma (train.py enforces). Spec starts at 0.99; raised after 4/10 runs stalled
                           # into idling at 0.99 (docs/dev_log.md sections 4-5, rule pre-registered in DECISIONS.md).
